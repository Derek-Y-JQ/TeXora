name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build and sign Windows installer
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          $fallback = !$env:CSC_LINK
          if ($fallback) {
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=TeXora Community Build" -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy Exportable -HashAlgorithm SHA256
            $env:CSC_KEY_PASSWORD = [guid]::NewGuid().ToString()
            $env:CSC_LINK = Join-Path $env:RUNNER_TEMP 'texora-signing.pfx'
            Export-PfxCertificate -Cert $cert -FilePath $env:CSC_LINK -Password (ConvertTo-SecureString $env:CSC_KEY_PASSWORD -AsPlainText -Force) | Out-Null
          }
          node scripts/package-release.cjs x64
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          node scripts/test-release-agent.cjs release/win-unpacked/TeXora.exe
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          $installer = Get-Item release/TeXora-Setup-*.exe
          $signature = Get-AuthenticodeSignature $installer
          if (!$signature.SignerCertificate -or $signature.Status -eq 'HashMismatch') {throw 'Invalid installer signature'}
          if ($fallback -and $signature.SignerCertificate.Thumbprint -ne $cert.Thumbprint) {throw 'Unexpected signer'}
          $note = if ($fallback) { 'Windows 使用自签名证书，系统可能提示未知发布者。' } else { 'Windows 使用仓库配置的代码签名证书。' }
          $note | Out-File -Encoding utf8 release/windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.exe
            release/windows.txt
  macos:
    permissions: {contents: read, actions: read}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, runner: macos-15}
          - {arch: x64, runner: macos-15-intel}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Check for a saved notarization submission
        id: resume
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          archived=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq ".artifacts[] | select(.name == \"notary-$ARCH\" and .expired == false) | .id")
          echo "saved=$(test -z "$archived" && echo false || echo true)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.resume.outputs.saved == 'true'
        with:
          name: notary-${{ matrix.arch }}
          path: release
      - run: npm test
        if: steps.resume.outputs.saved != 'true'
      - run: npm run build
        if: steps.resume.outputs.saved != 'true'
      - name: Build and verify signed application and disk image
        if: steps.resume.outputs.saved != 'true'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -o pipefail
          : "${CSC_LINK:?Missing MAC_CSC_LINK}" "${CSC_KEY_PASSWORD:?Missing MAC_CSC_KEY_PASSWORD}"
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/texora-signing.XXXXXX")
          trap 'rm -rf "$signing_dir"' EXIT
          openssl3="$(brew --prefix openssl@3)/bin/openssl"
          if ! printf '%s' "$CSC_LINK" | base64 -D > "$signing_dir/original.p12"; then
            echo "::error::MAC_CSC_LINK must contain the base64-encoded PKCS#12 file."
            exit 1
          fi
          if ! "$openssl3" pkcs12 -legacy -in "$signing_dir/original.p12" -passin env:CSC_KEY_PASSWORD -noout; then
            echo "::error::OpenSSL could not read the uploaded PKCS#12 with MAC_CSC_KEY_PASSWORD."
            exit 1
          fi
          # Normalize the container for macOS security import. Keep decrypted keys in the pipe.
          archive_password=$("$openssl3" rand -hex 32)
          echo "::add-mask::$archive_password"
          export TEXORA_ARCHIVE_PASSWORD="$archive_password"
          "$openssl3" pkcs12 -legacy -in "$signing_dir/original.p12" -passin env:CSC_KEY_PASSWORD \
            -nokeys -out "$signing_dir/certificates.pem"
          "$openssl3" pkcs12 -legacy -in "$signing_dir/original.p12" -passin env:CSC_KEY_PASSWORD -nocerts -noenc |
            "$openssl3" pkcs12 -export -in "$signing_dir/certificates.pem" -inkey /dev/stdin -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 \
              -passout env:TEXORA_ARCHIVE_PASSWORD -out "$signing_dir/signing.p12"
          echo "PKCS#12 credentials verified and prepared for macOS."
          export CSC_LINK="$signing_dir/signing.p12" CSC_KEY_PASSWORD="$TEXORA_ARCHIVE_PASSWORD"
          unset TEXORA_ARCHIVE_PASSWORD archive_password
          node scripts/package-release.cjs "$ARCH"
          compgen -G 'release/*.dmg' >/dev/null
      - name: Submit signed DMG to Apple
        if: steps.resume.outputs.saved != 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          : "${APPLE_ID:?Missing APPLE_ID}" "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID}" "${APPLE_APP_SPECIFIC_PASSWORD:?Missing APPLE_APP_SPECIFIC_PASSWORD}"
          disk=$(find release -maxdepth 1 -name '*.dmg')
          codesign --verify --strict --verbose=2 "$disk"
          codesign -dv --verbose=4 "$disk" 2>&1 | grep -Fx "TeamIdentifier=$APPLE_TEAM_ID"
          auth=(--apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD")
          xcrun notarytool submit "$disk" "${auth[@]}" --output-format json > "$RUNNER_TEMP/notary-submit.json"
          jq -er '.id | select(type == "string" and length > 0)' "$RUNNER_TEMP/notary-submit.json" > release/notary-id.txt
          echo "Apple submission: $(cat release/notary-id.txt)"
      - uses: actions/upload-artifact@v4
        if: steps.resume.outputs.saved != 'true'
        with:
          name: notary-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          path: |
            release/*.dmg
            release/notary-id.txt
      - name: Wait for Apple and validate the ticket
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          disk=$(find release -maxdepth 1 -name '*.dmg')
          submission=$(cat release/notary-id.txt)
          auth=(--apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD")
          echo "Waiting on Apple submission $submission"
          xcrun notarytool wait "$submission" "${auth[@]}" --timeout 5h || true
          status=$(xcrun notarytool info "$submission" "${auth[@]}" --output-format json | jq -er .status)
          case "$status" in
            Accepted) ;;
            "In Progress") echo "::error::Apple is still processing $submission. Re-run failed jobs to resume without re-uploading."; exit 1 ;;
            *) xcrun notarytool log "$submission" "${auth[@]}"; exit 1 ;;
          esac
          xcrun stapler staple "$disk"
          xcrun stapler validate "$disk"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$disk"
      - name: Verify and launch the distributed application
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          disk=$(find release -maxdepth 1 -name '*.dmg')
          hdiutil verify "$disk"
          mount="$RUNNER_TEMP/texora-mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$disk"
          codesign --verify --deep --strict --verbose=2 "$mount/TeXora.app"
          spctl --assess --type execute --verbose=4 "$mount/TeXora.app"
          ditto "$mount/TeXora.app" "$RUNNER_TEMP/TeXora.app"
          hdiutil detach "$mount"
          node scripts/test-release-agent.cjs "$RUNNER_TEMP/TeXora.app/Contents/MacOS/TeXora"
          echo "macOS $ARCH · Developer ID 签名，已通过 Apple 公证，DMG 已装订公证票据。" > "release/mac-$ARCH.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/mac-*.txt
  publish:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {path: release, pattern: '{windows,mac-*}', merge-multiple: true}
      - working-directory: release
        run: |
          sha256sum *.exe *.dmg > SHA256SUMS.txt
          git -C "$GITHUB_WORKSPACE" fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git -C "$GITHUB_WORKSPACE" for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > notes.md
          echo >> notes.md
          cat windows.txt mac-*.txt >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release/notes.md
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.dmg
            release/SHA256SUMS.txt
