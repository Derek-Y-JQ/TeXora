name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build and sign Windows installer
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          $fallback = !$env:CSC_LINK
          if ($fallback) {
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=TeXora Community Build" -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy Exportable -HashAlgorithm SHA256
            $env:CSC_KEY_PASSWORD = [guid]::NewGuid().ToString()
            $env:CSC_LINK = Join-Path $env:RUNNER_TEMP 'texora-signing.pfx'
            Export-PfxCertificate -Cert $cert -FilePath $env:CSC_LINK -Password (ConvertTo-SecureString $env:CSC_KEY_PASSWORD -AsPlainText -Force) | Out-Null
          }
          npx electron-builder --win nsis --x64 --publish never -c.forceCodeSigning=true
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          $installer = Get-Item release/TeXora-Setup-*.exe
          $signature = Get-AuthenticodeSignature $installer
          if (!$signature.SignerCertificate -or $signature.Status -eq 'HashMismatch') {throw 'Invalid installer signature'}
          if ($fallback -and $signature.SignerCertificate.Thumbprint -ne $cert.Thumbprint) {throw 'Unexpected signer'}
          $note = if ($fallback) { 'Windows 使用自签名证书，系统可能提示未知发布者。' } else { 'Windows 使用仓库配置的代码签名证书。' }
          $note | Out-File -Encoding utf8 release/windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.exe
            release/windows.txt
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build and verify signed application and disk image
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          ARCH: ${{ matrix.arch }}
        run: |
          if [[ -n "$CSC_LINK" ]]; then
            npx electron-builder --mac dmg --"$ARCH" --publish never -c.forceCodeSigning=true
            note="应用使用仓库配置的 Apple 证书签名。"
          else
            unset CSC_LINK CSC_KEY_PASSWORD
            npx electron-builder --mac dmg --"$ARCH" --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false
            note="应用使用 macOS 临时签名，未经 Apple 公证。"
          fi
          disk=$(find release -maxdepth 1 -name '*.dmg')
          hdiutil verify "$disk"
          mount="$RUNNER_TEMP/texora-mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$disk"
          codesign --verify --deep --strict --verbose=2 "$mount/TeXora.app"
          test -x "$mount/TeXora.app/Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/darwin-$ARCH/spawn-helper"
          hdiutil detach "$mount"
          echo "macOS $ARCH · $note" > "release/mac-$ARCH.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/mac-*.txt
  publish:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {path: release, merge-multiple: true}
      - working-directory: release
        run: |
          sha256sum *.exe *.dmg > SHA256SUMS.txt
          echo '默认白天主题。AI 侧栏可在 Ask 与本机 Agent 之间切换。' > notes.md
          cat windows.txt mac-*.txt >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release/notes.md
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.dmg
            release/SHA256SUMS.txt
