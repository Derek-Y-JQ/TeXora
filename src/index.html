    <div class="app" id="app">
      <header class="titlebar">
        <div class="titlebar-left">
          <div class="brand" id="brand">
            <span class="brand-mark"><img src="./assets/icon.png" alt="TeXora" /></span>
            <span class="brand-name">TeXora</span>
            <span class="brand-beta">BETA</span>
          </div>
          <span class="tb-sep"></span>
          <button class="project-pill" id="projectPill" title="打开项目文件夹">
            <svg class="ico"><use href="#i-folder" /></svg>
            <span class="project-pill-name" id="projectName">未打开项目</span>
            <svg class="ico ico-caret"><use href="#i-chevron-down" /></svg>
          </button>
          <button class="project-pill" id="overleafBtn" title="登录 Overleaf、加载与手动同步项目"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 3C8 2 3 7 4 14c1 7 10 8 14 1 2-4 2-8 2-12Z"/><path d="M3 22 16 8"/></svg><span>Overleaf</span></button>
        </div>
        <div class="titlebar-center">
          <button class="cmdk" id="commandBar">
            <svg class="ico"><use href="#i-search" /></svg>
            <span class="cmdk-hint">搜索命令、文件或符号…</span>
            <span class="cmdk-keys"><kbd>Ctrl</kbd><kbd>K</kbd></span>
          </button>
        </div>
        <div class="titlebar-right">
          <button class="icon-btn theme-btn" id="themeToggle" title="切换昼夜主题 (Ctrl+Shift+L)">
            <svg class="ico only-dark"><use href="#i-moon" /></svg>
            <svg class="ico only-light"><use href="#i-sun" /></svg>
          </button>
          <button class="icon-btn" id="updateBtn" title="检查更新"><svg class="ico"><use href="#i-download" /></svg></button>
          <button class="icon-btn" id="settingsBtn" title="设置 (Ctrl+,)">
            <svg class="ico"><use href="#i-sliders" /></svg>
          </button>
          <span class="tb-sep"></span>
          <div class="window-controls">
            <button class="win-btn" id="winMin" title="最小化"><svg class="ico"><use href="#i-minimize" /></svg></button>
            <button class="win-btn" id="winMax" title="最大化"><svg class="ico"><use href="#i-maximize" /></svg></button>
            <button class="win-btn win-close" id="winClose" title="关闭"><svg class="ico"><use href="#i-close" /></svg></button>
          </div>
        </div>
      </header>

      <div class="ribbon" id="ribbon">
        <div class="ribbon-scroll">
          <div class="ribbon-group">
            <div class="ribbon-row">
              <div class="split-btn" id="buildBtnGroup">
                <button class="btn btn-primary compile-btn" id="btnBuild" data-cmd="build.run" title="编译项目 (Ctrl+Alt+B)">
                  <svg class="ico"><use href="#i-compile" /></svg><span>编译</span>
                </button>
                <button class="btn btn-primary btn-caret" data-menu="build" title="编译选项" aria-label="编译选项"><svg class="ico"><use href="#i-chevron-down" /></svg></button>
              </div>
              <button class="btn btn-icon" data-cmd="build.clean" title="清理过程文件">
                <svg class="ico"><use href="#i-broom" /></svg>
              </button>
              <button class="btn btn-ghost engine-btn" data-menu="engine" id="engineBtn" title="编译引擎">
                <span class="engine-dot"></span><span id="engineLabel">XeLaTeX</span>
                <svg class="ico ico-caret"><use href="#i-chevron-down" /></svg>
              </button>
            </div>
            <div class="ribbon-label">编译</div>
          </div>

          <div class="ribbon-group">
            <div class="ribbon-row">
              <button class="btn btn-icon" data-format="bold" title="加粗 \textbf (Ctrl+B)"><svg class="ico"><use href="#i-bold" /></svg></button>
              <button class="btn btn-icon" data-format="italic" title="斜体 \textit (Ctrl+I)"><svg class="ico"><use href="#i-italic" /></svg></button>
              <button class="btn btn-icon" data-format="underline" title="下划线 \underline (Ctrl+U)"><svg class="ico"><use href="#i-underline" /></svg></button>
              <button class="btn btn-icon" data-format="strike" title="删除线 \sout"><svg class="ico"><use href="#i-strike" /></svg></button>
              <button class="btn btn-icon" data-format="emph" title="强调 \emph (Ctrl+E)"><svg class="ico"><use href="#i-emph" /></svg></button>
              <button class="btn btn-icon" data-format="texttt" title="等宽 \texttt"><svg class="ico"><use href="#i-tt" /></svg></button>
              <button class="btn btn-ghost size-btn" data-menu="size" id="sizeBtn" title="字号">
                <svg class="ico"><use href="#i-font-size" /></svg><span id="sizeLabel">字号</span><svg class="ico ico-caret"><use href="#i-chevron-down" /></svg>
              </button>
              <button class="btn btn-ghost font-btn" data-menu="font" id="fontBtn" title="字体（读取系统本地字体）">
                <svg class="ico"><use href="#i-type" /></svg><span>字体</span>
              </button>
            </div>
            <div class="ribbon-label">字形</div>
          </div>

          <div class="ribbon-group">
            <div class="ribbon-row">
              <button class="btn btn-icon" data-menu="list" title="列表环境"><svg class="ico"><use href="#i-list-ul" /></svg></button>
              <button class="btn btn-icon" data-menu="align" title="对齐方式"><svg class="ico"><use href="#i-align-left" /></svg></button>
              <button class="btn btn-icon" data-format="section" title="章节命令"><svg class="ico"><use href="#i-section" /></svg></button>
              <button class="btn btn-icon" data-menu="spacing" title="行距与段落"><svg class="ico"><use href="#i-line-spacing" /></svg></button>
            </div>
            <div class="ribbon-label">段落</div>
          </div>

          <div class="ribbon-group">
            <div class="ribbon-row">
              <button class="btn btn-icon" data-cmd="insert.image" title="插入图片（支持粘贴）"><svg class="ico"><use href="#i-image" /></svg></button>
              <button class="btn btn-icon" data-cmd="insert.table" title="插入表格（三线表 / 长表格）"><svg class="ico"><use href="#i-table" /></svg></button>
              <button class="btn btn-icon" data-cmd="insert.code" title="插入代码块"><svg class="ico"><use href="#i-code" /></svg></button>
              <button class="btn btn-icon" data-cmd="insert.algorithm" title="插入伪代码块"><svg class="ico"><use href="#i-algorithm" /></svg></button>
              <button class="btn btn-icon" data-menu="math" title="数学符号面板"><svg class="ico"><use href="#i-sigma" /></svg></button>
              <button class="btn btn-icon" data-cmd="insert.cite" title="插入引用"><svg class="ico"><use href="#i-book" /></svg></button>
              <button class="btn btn-icon" data-menu="env" title="插入环境"><svg class="ico"><use href="#i-environment" /></svg></button>
            </div>
            <div class="ribbon-label">插入</div>
          </div>

          <div class="ribbon-group">
            <div class="ribbon-row">
              <button class="btn btn-icon" data-cmd="format.punctHalf" title="中文标点 → 英文标点（自动补英文空格，保留顿号与引号）"><svg class="ico"><use href="#i-punct-half" /></svg></button>
              <button class="btn btn-icon" data-cmd="format.punctFull" title="英文标点 → 中文标点（自动去除多余空格，保留顿号与引号）"><svg class="ico"><use href="#i-punct-full" /></svg></button>
              <button class="btn btn-icon" data-format="displaystyle" title="行内公式 \displaystyle 化"><svg class="ico"><use href="#i-display-math" /></svg></button>
              <button class="btn btn-icon" data-cmd="view.toggleWordWrap" id="wrapBtn" title="自动换行 (Alt+Z)"><svg class="ico"><use href="#i-wrap" /></svg></button>
              <button class="btn btn-ghost" data-cmd="format.beautify" title="LaTeX 原稿格式整理">
                <svg class="ico"><use href="#i-wand" /></svg><span>整理</span>
              </button>
              <button class="btn btn-ghost" data-menu="tools" title="更多工具">
                <svg class="ico"><use href="#i-more" /></svg>
              </button>
            </div>
            <div class="ribbon-label">整理</div>
          </div>

          <div class="ribbon-group">
            <div class="ribbon-row">
              <button class="btn btn-ghost ai-btn" data-cmd="ai.assistant" title="AI 写作助手">
                <svg class="ico"><use href="#i-sparkles" /></svg><span>AI 助手</span>
              </button>
            </div>
            <div class="ribbon-label">智能</div>
          </div>
        </div>

        <div class="ribbon-tail">
          <button class="icon-btn" data-cmd="editor.replace" id="findBtn" title="查找与替换 (Ctrl+F / Ctrl+H)">
            <svg class="ico"><use href="#i-search" /></svg>
          </button>
          <button class="icon-btn" data-cmd="view.livePreview" id="liveBtn" title="自动编译">
            <svg class="ico"><use href="#i-auto-build" /></svg>
          </button>
          <button class="icon-btn" data-cmd="view.toggleSidebar" id="toggleSidebarBtn" title="折叠侧边栏">
            <svg class="ico"><use href="#i-panel-left" /></svg>
          </button>
          <button class="icon-btn" data-cmd="view.togglePreview" id="togglePreviewBtn" title="折叠 PDF 预览">
            <svg class="ico"><use href="#i-panel-right" /></svg>
          </button>
        </div>
      </div>

      <div class="workspace">
        <nav class="activitybar" id="activitybar">
          <button class="act-btn active" data-panel="files" title="文件浏览器"><svg class="ico"><use href="#i-files" /></svg></button>
          <button class="act-btn" data-panel="outline" title="文档大纲"><svg class="ico"><use href="#i-outline" /></svg></button>
          <button class="act-btn" data-panel="math" title="数学环境"><svg class="ico"><use href="#i-functions" /></svg></button>
          <button class="act-btn" data-panel="labels" title="标签与引用"><svg class="ico"><use href="#i-tags" /></svg></button>
          <button class="act-btn" data-panel="search" title="全局查找"><svg class="ico"><use href="#i-search" /></svg></button>
          <button class="act-btn" data-panel="history" title="本地历史"><svg class="ico"><use href="#i-history" /></svg></button>
          <button class="act-btn" data-panel="git" title="Git 版本控制"><svg class="ico"><use href="#i-git" /></svg></button>
          <span class="act-spacer"></span>
          <button class="act-btn" data-panel="ai" title="AI 助手"><svg class="ico"><use href="#i-assistant" /></svg></button>
        </nav>

        <aside class="sidebar" id="sidebar">
          <div class="sidebar-head">
            <div class="sidebar-title" id="sidebarTitle">文件</div>
            <div class="sidebar-actions" id="sidebarActions"></div>
          </div>
          <div class="sidebar-body" id="sidebarBody"></div>
        </aside>

        <div class="splitter" id="splitterSidebar" data-split="sidebar"></div>

        <main class="editor-area">
          <div class="tabstrip">
            <div class="tabs" id="tabs"></div>
            <div class="tabstrip-actions">
              <button class="editor-theme-btn" data-menu="codeTheme" id="codeThemeBtn" title="更换代码高亮主题" aria-label="更换代码高亮主题"><svg class="ico"><use href="#i-palette" /></svg><span id="codeThemeLabel">代码主题</span><svg class="ico ico-caret"><use href="#i-chevron-down" /></svg></button>
              <button class="icon-btn sm" data-cmd="doc.new" title="新建文档"><svg class="ico"><use href="#i-plus" /></svg></button>
              <button class="icon-btn sm" data-cmd="build.toggleProblems" id="problemsToggle" title="问题面板"><svg class="ico"><use href="#i-alert" /></svg></button>
            </div>
          </div>
          <div class="editor-shell" id="editorShell">
            <div class="breadcrumbs" id="breadcrumbs"></div>
            <div class="editor-host" id="editorHost"></div>
            <div class="editor-empty" id="editorEmpty">
              <div class="empty-card">
                <div class="empty-mark"><svg viewBox="0 0 24 24"><path d="M5.4 18.6 12 5.2l2.6 5.3 2.2-2.3 1.6 1.6-3.4 3.5 3.6 7.3h-3l-2.6-5.3-2.5 5.3z" fill="currentColor" stroke="none"/></svg></div>
                <h2>开始一段安静的写作</h2>
                <p>打开一个 LaTeX 项目，或从模板中心新建文档。</p>
                <div class="empty-actions">
                  <button class="btn btn-primary" data-cmd="project.open"><svg class="ico"><use href="#i-folder" /></svg>打开项目</button>
                  <button class="btn" data-cmd="project.new"><svg class="ico"><use href="#i-plus" /></svg>新建文档</button>
                  <button class="btn" data-cmd="templates.open"><svg class="ico"><use href="#i-layers" /></svg>模板中心</button>
                </div>
                <div class="empty-recent" id="emptyRecent"></div>
              </div>
            </div>
          </div>
          <div class="problems" id="problems">
            <div class="problems-head">
              <div class="problems-tabs" id="problemsTabs">
                <button class="ptab active" data-problems="all">全部 <span class="badge" id="badgeAll">0</span></button>
                <button class="ptab" data-problems="error">错误 <span class="badge danger" id="badgeErr">0</span></button>
                <button class="ptab" data-problems="warning">警告 <span class="badge warn" id="badgeWarn">0</span></button>
                <button class="ptab" data-problems="log">编译输出</button>
              </div>
              <div class="problems-actions">
                <button class="btn btn-tiny" data-cmd="ai.fixProblem"><svg class="ico"><use href="#i-sparkles" /></svg>AI 修复建议</button>
                <button class="icon-btn sm" data-cmd="build.toggleProblems" title="收起"><svg class="ico"><use href="#i-chevron-down" /></svg></button>
              </div>
            </div>
            <div class="problems-body" id="problemsBody"></div>
          </div>
        </main>

        <div class="splitter" id="splitterPreview" data-split="preview"></div>

        <section class="preview" id="previewPane">
          <div class="preview-toolbar">
            <div class="pv-group">
              <button class="icon-btn sm" data-cmd="preview.prev" title="上一页"><svg class="ico"><use href="#i-chevron-left" /></svg></button>
              <span class="pv-pages"><span id="pageCurrent">–</span><span class="pv-sep">/</span><span id="pageTotal">–</span></span>
              <button class="icon-btn sm" data-cmd="preview.next" title="下一页"><svg class="ico"><use href="#i-chevron-right" /></svg></button>
            </div>
            <div class="pv-group">
              <button class="icon-btn sm" data-cmd="preview.zoomOut" title="缩小"><svg class="ico"><use href="#i-zoom-out" /></svg></button>
              <span class="pv-zoom" id="zoomLabel">100%</span>
              <button class="icon-btn sm" data-cmd="preview.zoomIn" title="放大"><svg class="ico"><use href="#i-zoom-in" /></svg></button>
              <button class="icon-btn sm" data-cmd="preview.fitWidth" title="适合宽度"><svg class="ico"><use href="#i-fit" /></svg></button>
            </div>
            <div class="pv-group pv-right">
              <button class="icon-btn sm" data-cmd="preview.invert" id="invertBtn" title="夜间护眼反色"><svg class="ico"><use href="#i-moon" /></svg></button>
              <button class="icon-btn sm" data-cmd="preview.refresh" title="刷新预览"><svg class="ico"><use href="#i-refresh" /></svg></button>
              <button class="icon-btn sm" data-cmd="preview.external" title="用外部程序打开 PDF"><svg class="ico"><use href="#i-external" /></svg></button>
            </div>
          </div>
          <div class="preview-stage" id="previewStage">
            <div class="preview-placeholder" id="previewPlaceholder">
              <div class="pv-icon"><svg class="ico"><use href="#i-paper" /></svg></div>
              <p id="previewHint">编译后在此显示 PDF 预览</p>
              <button class="btn btn-sm" data-cmd="build.run">立即编译</button>
            </div>
          </div>
          <div class="preview-progress" id="previewProgress"><span></span></div>
        </section>
      </div>

      <footer class="statusbar" id="statusbar">
        <div class="sb-left">
          <button class="sb-item sb-build" id="sbBuild" data-cmd="build.run">
            <span class="sb-dot" id="sbDot"></span><span id="sbBuildText">空闲</span>
          </button>
          <span class="sb-item" id="sbEngine">XeLaTeX</span>
          <span class="sb-item sb-live" id="sbLive" data-cmd="view.livePreview"><svg class="ico"><use href="#i-eye" /></svg>自动编译开</span>
          <button class="sb-item" id="sbRootFile" title="点击切换主文档"><svg class="ico"><use href="#i-target" /></svg><span id="sbRootName">main.tex</span></button>
        </div>
        <div class="sb-center">
          <button class="sb-item" id="sbProblems" data-cmd="build.toggleProblems">
            <svg class="ico"><use href="#i-alert" /></svg><span id="sbProblemsText">0 个问题</span>
          </button>
          <span class="sb-item" id="sbStats">0 字 · 0 词</span>
        </div>
        <div class="sb-right">
          <span class="sb-item" id="sbCursor">Ln 1, Col 1</span>
          <span class="sb-item">UTF-8</span>
          <span class="sb-item">CRLF</span>
          <span class="sb-item" id="sbWrap" data-cmd="view.toggleWordWrap" title="切换自动换行 (Alt+Z)">换行: 关</span>
          <span class="sb-item" id="sbSpaces">空格: 2</span>
          <span class="sb-item sb-git" id="sbGit"><svg class="ico"><use href="#i-branch" /></svg><span id="sbGitText">–</span></span>
          <span class="sb-item sb-theme" id="sbTheme">夜晚</span>
        </div>
      </footer>
    </div>

    <div class="find-bar" id="findBar">
      <div class="find-line">
        <input class="input input-sm" id="findInput" placeholder="在本文件中查找…" spellcheck="false" />
        <span class="find-count" id="findCount">0/0</span>
        <button class="find-btn" id="findCase" title="区分大小写">Aa</button>
        <button class="find-btn" id="findPrev" title="上一个 (Shift+Enter)">↑</button>
        <button class="find-btn" id="findNext" title="下一个 (Enter)">↓</button>
        <button class="find-btn" id="findToggleReplace" title="切换替换">⇄</button>
        <button class="find-btn" id="findClose" title="关闭 (Esc)">×</button>
      </div>
      <div class="find-line find-replace-line">
        <input class="input input-sm" id="findReplace" placeholder="替换为…" spellcheck="false" />
        <button class="find-btn wide" id="findReplaceOne">替换当前</button>
        <button class="find-btn wide" id="findReplaceAll">全部替换</button>
      </div>
    </div>
    <div class="tooltip-layer" id="tooltipLayer"></div>
    <div class="menu-layer" id="menuLayer"></div>
    <div class="modal-layer" id="modalLayer"></div>
    <div class="toast-layer" id="toastLayer"></div>
    <div class="palette-layer" id="paletteLayer"></div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
