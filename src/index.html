                <button class="ptab active" data-problems="all">全部 <span class="badge" id="badgeAll">0</span></button>
                <button class="ptab" data-problems="error">错误 <span class="badge danger" id="badgeErr">0</span></button>
                <button class="ptab" data-problems="warning">警告 <span class="badge warn" id="badgeWarn">0</span></button>
                <button class="ptab" data-problems="log">编译输出</button>
              </div>
              <div class="problems-actions">
                <button class="btn btn-tiny" data-cmd="ai.fixProblem"><svg aria-hidden="true" class="ico"><use href="#i-sparkles" /></svg>AI 修复建议</button>
                <button class="icon-btn sm" data-cmd="build.toggleProblems" title="收起" aria-label="收起"><svg aria-hidden="true" class="ico"><use href="#i-chevron-down" /></svg></button>
              </div>
            </div>
            <div class="problems-body" id="problemsBody"></div>
          </div>
        </main>

        <div class="splitter" id="splitterPreview" data-split="preview"></div>

        <section class="preview" id="previewPane">
          <div id="pdfDocumentStatus" class="pdf-document-status" role="status" hidden></div>
          <div class="preview-toolbar">
            <div class="pv-group">
              <button class="icon-btn sm" data-cmd="preview.prev" title="上一页" aria-label="上一页"><svg aria-hidden="true" class="ico"><use href="#i-chevron-left" /></svg></button>
              <span class="pv-pages"><span id="pageCurrent">–</span><span class="pv-sep">/</span><span id="pageTotal">–</span></span>
              <button class="icon-btn sm" data-cmd="preview.next" title="下一页" aria-label="下一页"><svg aria-hidden="true" class="ico"><use href="#i-chevron-right" /></svg></button>
            </div>
            <div class="pv-group">
              <button class="icon-btn sm" data-cmd="preview.zoomOut" title="缩小" aria-label="缩小"><svg aria-hidden="true" class="ico"><use href="#i-zoom-out" /></svg></button>
              <span class="pv-zoom" id="zoomLabel">100%</span>
              <button class="icon-btn sm" data-cmd="preview.zoomIn" title="放大" aria-label="放大"><svg aria-hidden="true" class="ico"><use href="#i-zoom-in" /></svg></button>
              <button class="icon-btn sm" data-cmd="preview.fitWidth" title="适合宽度" aria-label="适合宽度"><svg aria-hidden="true" class="ico"><use href="#i-fit" /></svg></button>
            </div>
            <div class="pv-group pv-right">
              <button class="icon-btn sm" data-cmd="preview.invert" id="invertBtn" title="夜间护眼反色" aria-label="夜间护眼反色"><svg aria-hidden="true" class="ico"><use href="#i-moon" /></svg></button>
              <button class="icon-btn sm" data-cmd="preview.refresh" title="刷新预览" aria-label="刷新预览"><svg aria-hidden="true" class="ico"><use href="#i-refresh" /></svg></button>
              <button class="icon-btn sm" data-cmd="preview.external" title="用外部程序打开 PDF" aria-label="用外部程序打开 PDF"><svg aria-hidden="true" class="ico"><use href="#i-external" /></svg></button>
              <button class="icon-btn sm" data-cmd="preview.open" title="打开 PDF" aria-label="打开 PDF"><svg aria-hidden="true" class="ico"><use href="#i-files" /></svg></button>
            </div>
          </div>
          <div class="preview-stage" id="previewStage">
            <div class="preview-placeholder" id="previewPlaceholder">
              <div class="pv-icon"><svg aria-hidden="true" class="ico"><use href="#i-paper" /></svg></div>
              <p id="previewHint">编译后在此显示 PDF 预览</p>
              <button class="btn btn-sm" data-cmd="build.run">立即编译</button>
            </div>
          </div>
          <div class="preview-progress" id="previewProgress"><span></span></div>
        </section>
      </div>

      <footer class="statusbar" id="statusbar">
        <div class="sb-left">
          <button class="sb-item sb-build" id="sbBuild" data-cmd="build.run">
            <span class="sb-dot" id="sbDot"></span><span id="sbBuildText">空闲</span>
          </button>
          <span class="sb-item" id="sbEngine">XeLaTeX</span>
          <span class="sb-item sb-live" id="sbLive" data-cmd="view.livePreview"><svg aria-hidden="true" class="ico"><use href="#i-eye" /></svg>自动编译开</span>
          <button class="sb-item" id="sbRootFile" title="点击切换主文档"><svg aria-hidden="true" class="ico"><use href="#i-target" /></svg><span id="sbRootName">main.tex</span></button>
        </div>
        <div class="sb-center">
          <button class="sb-item" id="sbProblems" data-cmd="build.toggleProblems">
            <svg aria-hidden="true" class="ico"><use href="#i-alert" /></svg><span id="sbProblemsText">0 个问题</span>
          </button>
          <span class="sb-item" id="sbStats">0 字 · 0 词</span>
        </div>
        <div class="sb-right">
          <span class="sb-item" id="sbCursor">Ln 1, Col 1</span>
          <span class="sb-item">UTF-8</span>
          <span class="sb-item">CRLF</span>
          <span class="sb-item" id="sbWrap" data-cmd="view.toggleWordWrap" title="切换自动换行 (Alt+Z)">换行: 关</span>
          <span class="sb-item" id="sbSpaces">空格: 2</span>
          <span class="sb-item sb-git" id="sbGit"><svg aria-hidden="true" class="ico"><use href="#i-branch" /></svg><span id="sbGitText">–</span></span>
          <span class="sb-item sb-theme" id="sbTheme">夜晚</span>
        </div>
      </footer>
    </div>

    <div class="find-bar" id="findBar">
      <div class="find-line">
        <input class="input input-sm" id="findInput" placeholder="在本文件中查找…" spellcheck="false" />
        <span class="find-count" id="findCount">0/0</span>
        <button class="find-btn" id="findCase" title="区分大小写">Aa</button>
        <button class="find-btn" id="findPrev" title="上一个 (Shift+Enter)" aria-label="上一个"><svg aria-hidden="true" class="ico"><use href="#i-arrow-up" /></svg></button>
        <button class="find-btn" id="findNext" title="下一个 (Enter)" aria-label="下一个"><svg aria-hidden="true" class="ico"><use href="#i-arrow-down" /></svg></button>
        <button class="find-btn" id="findToggleReplace" title="切换替换" aria-label="切换替换"><svg aria-hidden="true" class="ico"><use href="#i-replace" /></svg></button>
        <button class="find-btn" id="findClose" title="关闭 (Esc)" aria-label="关闭"><svg aria-hidden="true" class="ico"><use href="#i-close" /></svg></button>
      </div>
      <div class="find-line find-replace-line">
        <input class="input input-sm" id="findReplace" placeholder="替换为…" spellcheck="false" />
        <button class="find-btn wide" id="findReplaceOne">替换当前</button>
        <button class="find-btn wide" id="findReplaceAll">全部替换</button>
      </div>
    </div>
    <div class="tooltip-layer" id="tooltipLayer"></div>
    <div class="menu-layer" id="menuLayer"></div>
    <div class="modal-layer" id="modalLayer"></div>
    <div class="toast-layer" id="toastLayer"></div>
    <div class="palette-layer" id="paletteLayer"></div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
